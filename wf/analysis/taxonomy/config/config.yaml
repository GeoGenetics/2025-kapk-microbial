# Basic config File
# Where is the workflow
wdir: "/path/to/workflow/taxonomy"
# Where is the data
sdir: "/path/to/input/data"
# Where is the output
rdir: "/path/to/results"

tmp: "/path/to/tmp"
sample_file_read: "/path/to/assets/samples.tsv"

###############################################################################
#
# Common config values
#
###############################################################################
#Add binary paths
seqkit_bin: "seqkit"
bowtie2_bin: "bowtie2"
bowtie2_build_bin: "bowtie2-build"
samtools_bin: "samtools"
picard_jar: "/path/to/picard/picard.jar"
awk_bin: mawk
taxonkit_bin: taxonkit
csvtk_bin: csvtk
datamash_bin: datamash
mmseqs_bin: mmseqs
xfilter_bin: xFilter
rename_bin: rename.sh
vsearch_bin: vsearch
tadpole_bin: tadpole.sh
loglog_bin: loglog.sh
filter_bam_bin: filterBAM
dread_bin: dReads

# Program parameters
# Threads
seqkit_threads: 16
extract_threads: 8
norm_threads: 32
read_rename_threads: 16
read_extension_threads: 32
read_derep_threads: 8
bowtie2_tp_threads: 24
mdmg_threads: 8
mdmg_cores: 1
mdmg_cores_pr_fit: 16
tp_threads: 48
mmseqs2_threads: 24

# Rename reads
rename_reads: False
read_minlen: 30
rename_parms: "addunderscore=f overwrite=t"

# Read extension
extend_reads: True
loglog_bits: 16
loglog_hashes: 3
loglog_table_cap: 0.5
loglog_memory: "300G"
loglog_seed: 1234
tadpole_mode: "extend"
tadpole_length: 100
tadpole_memory: "300G"
tadpole_k: 17
minprobprefilter: f
trimends: 9
prefilter: 0
maxmem: "214748364800"
ibb: f
ecc: t
ecco: f
conservative: t

# Read dereplication
derep_reads: True
use_vsearch: True
derep_parms: "--strand both --sizeout --fastaout -"

# The input reads can come from two different sources:
# 1. We use raw reads [raw]
# 2. The reads come from the path rename-extension-derep [standard]
# 1. The reads come from the path rename-extension-derep-prefilter [prefilter]
remove_fastq: True
remove_bam: True
profiling_data_input: ["standard"]
tp_bowtie2_tmp: "/path/to/tmp"
bowtie2_tp_db: "/path/to/db/bowtie2/hires-organelles-viruses-arctic"

# Configuration for bowtie2 searches
tp_bowtie2_parms: -D 15 -R 2 -N 1 -L 22 -i S,1,1.15 --np 1 --mp "1,1" --rdg "0,1" --rfg "0,1" --score-min "L,0,-0.1" --no-unal
tp_bowtie2_k: [1000]
tp_sizes: "/path/to/db/genomes.len.map"
tp_norm_scale: 1M
tp_filter_sort_mem: 8G
tp_filter_nreads: 100
tp_filter_exp_bratio: 0.75
tp_filter_exp_bratio_dmg: 0.25
tp_filter_cov_evenness: 0.4
tp_filter_read_ani: ["92"]
tp_extra: "-a 94 --read-length-freqs --read-hits-count --include-low-detection --min-breadth 0.01"
tp_filter_entropy: "auto"
tp_filter_gini: "auto"

# Picard
picard_java_opts: "-Xms2g -Xmx100g"
picard_max_records_in_ram: 25000000

# Samtools
samtools_view_parms: "-F 4 -b"
samtools_sort_parms: "-m 8G"

# include unclassified reads
include_noneuk_nuclear_unclassified: True

# MetaDMG
mdmg_bin: metaDMG
mdmg_cpp: "/path/to/metaDMG-cpp"
mdmg_fixncbi: 1
mdmg_weight: [1]
mdmg_mode: ["local", "global", "lca"]
mdmg_acc2tax: "/path/to/db/taxonomy/acc2taxid.map.gz"
mdmg_nodes: "/path/to/db/taxonomy/nodes.dmp"
mdmg_names: "/path/to/db/taxonomy/names.dmp"
mdmg_extra: "--bayesian"
mdmg_positions: 35
mdmg_lcarank: "''"
mdmg_simscorelow: 0.90
mdmg_pmd_threshold: 3

# Recover reads from references with damage
dread_filter_read_ani: ["94"]
dread_filter_mdmg: '{"damage": 0.11, "significance": 2}'
dread_filter_fb: '{"breadth": 0.01, "n_reads": 100}'
dread_sort_memory: "8G"
dread_rank: '{"domain":["d__Bacteria", "d__Archaea", "d__Viruses", "d__Eukaryota"]}'
dread_tax: "/path/to/db/tax/hires-organelles-viruses-arctic.tax.tsv"

bowtie2_dr_threads: 48

dr_fraction: ["damaged"]

db_mag_distribution:
  [
    {
      "woodcroft2018":
        {
          bowtie2_db: "/path/to/db/bowtie2/woodcroft2018",
          db_mag_sizes: "/path/to/db/bowtie2/woodcroft2018.len.map",
        },
    },
    {
      "GEM-20220926__tg2g-20220926":
        {
          bowtie2_db: "/path/to/db/bowtie2/GEM-20220926__tg2g-20220926",
          db_mag_sizes: "/path/to/db/bowtie2/GEM-20220926__tg2g-20220926.len.map",
        },
    },
  ]

db_other:
  [
    {
      "archaea-viruses":
        {
          bowtie2_db: "/path/to/db/bowtie2/archaeal-viruses",
          db_genome_sizes: "/path/to/db/bowtie2/archaeal-viruses.len.map",
        },
    },
    {
      "borgs":
        {
          bowtie2_db: "/path/to/db/bowtie2/borg-genomes",
          db_genome_sizes: "/path/to/db/bowtie2/borg-genomes.len.map",
        },
    },
  ]

# Best mapping damage reads
bm_filter_read_ani: ["94", "95", "96", "97", "98", "99"]

# Map aa viruses
viruses_db_aa:
  [
    {
      "IMGVR4_derepG-archaea":
        {
          "mmseqs_db": "/path/to/db/IMGVR4/IMGVR_all_proteins-high_confidence_derepG-archaeal",
          "mapping_list": "/path/to/db/IMGVR4/IMGVR_all_proteins-high_confidence_derepG-archaeal.gene.lst",
        },
    },
  ]
mmseqs_viral_parms: "--comp-bias-corr 0 --mask 0 -e 1e-5 --exact-kmer-matching 1 --sub-mat PAM30.out -s 3 -k 6 --spaced-kmer-mode 1 --spaced-kmer-pattern 11011101 --min-length 15 --format-mode 2 -c 0.8 --cov-mode 2 --min-seq-id 0.6"
xfilter_parms: "-n 25 -b 20 -e 1e-5 --breadth-expected-ratio 0 -f depth_evenness --depth-evenness 1"
