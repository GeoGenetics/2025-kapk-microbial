# AGP Validation Workflow Configuration - denbi-h-micro

# Tool paths
agp_binary: "/vol/cloud/agp/bin/dart"
mmseqs_binary: "/vol/cloud/agp/bin/mmseqs"
vtml20_matrix: "/vol/cloud/agp/data/sub-mat/VTML20.out"

# Output directory
output_dir: "/vol/cloud/agp/validation_workflow/results"

# Real sample data
real_samples:
  derep_dir: "/vol/cloud/agp/data/derep"
  metadmg_dir: "/vol/cloud/agp/metadmg_results"
  sample_mapping: "/vol/cloud/agp/validation_workflow/paper_sample_mapping.tsv"
  samples: {}

# Synthetic sample data
synthetic_samples:
  base_dir: "/vol/cloud/agp/data/benchmark"
  flat_structure: true
  samples: []

# KEGG database
kegg:
  db: "/vol/cloud/agp/data/kegg_mmseqs2/kegg_genes-i0.9-c0.8"
  gene_list: "/vol/cloud/agp/data/kegg_mmseqs2/kegg_genes.tsv"

# CAZy database (dbCAN)
cazy:
  db: "/vol/cloud/agp/data/dbcan_mmseqs2/CAZyDB.08062022"
  gene_list: "/vol/cloud/agp/data/dbcan_mmseqs2/dbCAN_gene.list"

# Viral database (IMGVR4)
viral:
  db: "/vol/cloud/agp/data/imgvr_mmseqs2/IMGVR_all_proteins-high_confidence_derepG-archaeal"
  gene_list: "/vol/cloud/agp/data/imgvr_mmseqs2/IMGVR_all_proteins-high_confidence_derepG-archaeal.gene.lst"

# MMseqs2 parameters
mmseqs2:
  min_length: 12
  evalue: 10.0
  min_seq_id: 0.86
  coverage: 0.65
  sensitivity: 2
  kmer_size: 6
  spaced_kmer_pattern: "11011101"
  max_seqs: 10000
  threads: 32

# AGP parameters
agp:
  library_type: "ds"
  domain: "gtdb"
  threads: 8

# Damage filtering
damage_filter:
  threshold: 0.7

# FGS parameters (for synthetic samples only)
fgs:
  binary: "/vol/cloud/agp/bin/FragGeneScanRs"
  train_file: "illumina_5"
  threads: 8

# Blastx parameters
blastx:
  threads: 16

# Synthetic benchmark samples
synthetic_samples:
  base_dir: "/vol/cloud/agp/data/benchmark"
  sample_list: "/vol/cloud/agp/validation_workflow/samples/synthetic_samples.tsv"
