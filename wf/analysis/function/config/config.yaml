# AGP KEGG Damage Workflow Config
# DART + KEGG/dbCAN/Viral functional annotation with damage validation

###############################################################################
# Paths
###############################################################################
wdir: "/path/to/workflow"
sdir: "/path/to/input/data"
rdir: "/path/to/results"
tmp: "/path/to/tmp"
sample_file_read: "/path/to/samples.tsv"

###############################################################################
# Tool binaries
###############################################################################
mmseqs_bin: mmseqs
seqkit_bin: seqkit
vsearch_bin: vsearch

# AGP binary
agp_bin: "/maps/projects/fernandezguerra/apps/repos/ancient-gene-prediction/build_release/dart"

###############################################################################
# Thread allocation
###############################################################################
seqkit_threads: 16
read_derep_threads: 8
mmseqs2_threads: 32
anvio_threads: 4
agp_threads: 4

###############################################################################
# Read preprocessing
###############################################################################
rename_reads: False
read_minlen: 30
derep_reads: True
derep_parms: "--strand both --sizeout --fastaout -"

###############################################################################
# AGP settings
###############################################################################
# Taxonomic domain for hexamer tables: gtdb, fungi, plant, protozoa, invertebrate, viral
agp_domain: "gtdb"

# Minimum sequence identity for MMseqs2 (VTML20 allows lower identity)
agp_min_seq_id: "0.5"

# Damage probability threshold for filtering (posterior >= threshold → is_damaged)
damage_threshold: 0.5

# damage-annotate filtering options
# prior_ancient: Prior P(ancient) for Bayesian scorer (default: 0.10)
prior_ancient: 0.10
# damage_min_reads: Min supporting reads per protein (default: 3)
damage_min_reads: 3
# damage_min_breadth: Min alignment breadth 0-1 — fraction of protein covered by reads (default: 0.10)
damage_min_breadth: 0.10
# damage_min_depth: Min mean depth across protein (default: 0 = disabled)
# Keep at 0 for ancient DNA — short reads on long proteins give low depth even for genuine hits
damage_min_depth: 0
# damage_threads: Threads for damage-annotate (default: 8)
damage_threads: 8
# damage_preset: Apply filter bundle — "loose" (maximize recall) or "strict" (maximize precision)
# Leave empty for defaults. strict enables auto-calibrate-spurious + tighter coverage filters.
# damage_preset: "strict"
# damage_auto_calibrate: Auto-derive min-positional-score and min-terminal-ratio from data
# Replaces x-filter depth-evenness: removes proteins where reads pile at termini only
damage_auto_calibrate: true

###############################################################################
# VTML20 matrix (optimized for ancient DNA damage)
###############################################################################
vtml20_matrix: "/maps/projects/fernandezguerra/apps/repos/read2Struct/read2Struct/data/mmseqs2/sub-mat/VTML20.out"

###############################################################################
# KEGG database
###############################################################################
kegg_db: "/datasets/fernandezguerra/data/DB/KEGG/20220228/genes/mmseqs2/kegg_genes-i0.9-c0.8"
kegg_gene_list: "/datasets/fernandezguerra/data/DB/KEGG/20220228/genes/kegg-genes.txt"
annotation_source: "KEGGgenes"
anvi_estimate_extra_parms: ""

###############################################################################
# dbCAN (CAZy) database
###############################################################################
dbcan_db: "/path/to/db/dbCAN/CAZyDB"
dbcan_gene_list: "/path/to/db/dbCAN/dbCAN_gene.list"
dbcan_annotation_source: "dbCAN"

###############################################################################
# Viral database
###############################################################################
viral_db: "/path/to/db/viral/viral_proteins"

###############################################################################
# Legacy MMseqs2 parameters (for nucleotide-based search, not used with AGP)
###############################################################################
mmseqs_kegg_parms: "--comp-bias-corr 0 --mask 0 -e 1e-5 --exact-kmer-matching 1 --sub-mat PAM30.out -s 3 -k 6 --spaced-kmer-mode 1 --spaced-kmer-pattern 11011101 --min-length 15 --format-mode 2 -c 0.8 --cov-mode 2 --min-seq-id 0.6"
mmseqs_dbcan_parms: "--comp-bias-corr 0 --mask 0 -e 1e-5 --exact-kmer-matching 1 --sub-mat PAM30.out -s 3 -k 6 --spaced-kmer-mode 1 --spaced-kmer-pattern 11011101 --min-length 15 --format-mode 2 -c 0.8 --cov-mode 2 --min-seq-id 0.6"
